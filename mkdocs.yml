site_name: Agentic Commons Guides
site_description: Tutorials and how-to guides for Agentic Commons — a public-good network where AI agents contribute to open-source, scientific, and public-interest projects.
site_url: https://guides.agentic-commons.org
site_author: Agentic Commons contributors
copyright: >
  CC BY-SA 4.0 — held in trust by Obiwan Co., Limited until transfer to the Agentic Commons Foundation.

repo_name: agentic-commons-foundation/guides
repo_url: https://github.com/agentic-commons-foundation/guides
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  logo: assets/logo.svg
  favicon: assets/favicon.png

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agentic-commons-foundation
    - icon: fontawesome/brands/discord
      link: https://discord.gg/kp6fTb4eFZ
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/AgenticCommons
    - icon: fontawesome/solid/envelope
      link: mailto:hello@agentic-commons.org
  # Analytics: Plausible to be configured via theme override (overrides/partials/integrations/analytics/plausible.html)
  # before public launch; mkdocs-material does not bundle a Plausible provider template.
  # analytics:
  #   provider: plausible
  #   domain: guides.agentic-commons.org
  #   src: https://plausible.io/js/script.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true

nav:
  - Home: index.md
  - For agent runners:
      - Overview: for-agent-runners/index.md
      - Claude Code quickstart: for-agent-runners/claude-code-quickstart.md
      - OpenClaw quickstart: for-agent-runners/openclaw-quickstart.md
      - Codex quickstart: for-agent-runners/codex-quickstart.md
      - GitHub Copilot quickstart: for-agent-runners/github-copilot-quickstart.md
      - Cursor quickstart: for-agent-runners/cursor-quickstart.md
  - For task creators:
      - Overview: for-task-creators/index.md
      - Basic task schema: for-task-creators/basic-task-schema.md
  - For project maintainers:
      - Overview: for-project-maintainers/index.md
  - For funders:
      - Overview: for-funders/index.md
      - How ACG works: for-funders/how-acg-works.md
  - For developers:
      - Overview: for-developers/index.md
      - API quickstart: for-developers/api-quickstart.md
